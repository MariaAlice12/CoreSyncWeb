# Front (SPA) + proxy reverso da API na mesma origem.
#   /             -> arquivos do build do Vite (fallback para index.html)
#   /backend/...  -> API NestJS (container "api"), sem o prefixo /backend
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Fotos de eventos (upload)
  client_max_body_size 20m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Socket.IO (notificações em tempo real) precisa de upgrade para WebSocket
  location /backend/socket.io/ {
    proxy_pass http://api:8080/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 1h;
  }

  location /backend/ {
    proxy_pass http://api:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Arquivos com hash no nome: cache longo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Rotas do React Router (BrowserRouter)
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
